- aid: bancomat:bancomat-bulk-api
  name: Bancomat Bulk API
  description: >-
    Questo endpoint consente di effettuare pagamenti bulk di documenti di diversi tipi. <br> Nota: l'API
    di questo endpoint non richiede scope specifici, il token di autorizzazione utilizzato deve avere
    accesso ai documenti che desidera pagare.


    <p align="center">


    <img src="https://mermaid.ink/svg/pako:eNqFkl9rwjAUxb9KyB58qWCryOjDwO4PCGOIle2lL7fNrQs2iUtT0YnffYmtGjdhebo553dPEm72tFAMaUxrAwafOCw1iEwSuxjXWBiuJHmdt8pUbhQvMExQhv3-A0maanXlRM4hNy3XFP2yZrBUs4kTL5qrjthsmnbUND0Ki0m7Xxw7yIe9njvulhjRgArUAjizT9s7JKPmEwVmNLZlDrWtAk9_B80hr7B2wL7NzGippHkBwatd29ebq1wZ1QvIBjUDCQFxfVWXdWpJ-Xd3UDhebz1zrbkAvXtUldItcMcYDsviL5MozVD75Gg8LMrSI8FOZwNuQslq6ZNlVN5fZXrk_7HdBRa4NT4XDoaDEXpcjV8NygLfGpFfR57e5MhDJg92GtAYle5kQWOjGwxos2aX_0bjEqr6rD4zbpTuxMMPPNfQrg"
    width="50%">


    </p>


    Il diagramma sopra mostra come funziona bulk.


    Supponiamo il caso in cui un utente abbia due fatture per il beneficiario 1 (Ben1), una fattura per
    il beneficiario 2 (Ben2) e un pagamento PagoPA


    L'utente desidera pagare tutti in un'unica operazione.


    Il client dell'utente, che ha accesso a tutti i documenti, chiama l'endpoint in blocco con l'elenco
    dei documenti da pagare, l'endpoint restituisce un nuovo documento (Bulk) collegato a tutti i documenti
    da pagare.


    Il client fornisce il documento bulk all'utente, che ora può pagarlo con un'unica operazione di Payment
    Initiation (PIS). Il bonifico bancario consentito con PIS sul documento in blocco è indirizzato al
    conto tecnico FlowPay (TA). Quando il TA riceve il pagamento, divide l'importo tra i beneficiari e
    invia loro i pagamenti tramite bonifico bancario.


    In caso di pagamento bulk allo stesso beneficiario, il beneficiario effettivo di avvio del pagamento
    è il beneficiario stesso, quindi il pagatore può riconoscere facilmente la transazione. In caso contrario,
    il beneficiario effettivo di avvio del pagamento è FlowPay.


    I bonifici bancari ai beneficiari vengono inviati con lo stesso pagatore originale, quindi i beneficiari
    possono identificare facilmente il pagatore.


    Nota: il destinatario dei pagamenti pagoPA è FlowPay stesso, quindi i pagamenti correlati non vengono
    conteggiati nelle operazioni di suddivisione.
