    put:
      description: 'Setta pagati all''esterno di FlowPay i termini del documento identificato da `fingerprint`.

        Il ruolo di chi effettua la chiamata è rilevante ai fini di ciò che è possibile segnalare come già pagato.

        Un termine per il quale esiste un pagamento non è settabile a già pagato.

        Il debitore ha la facoltà di segnalare già pagato un termine per il quale non esiste un pagamento, oppure di settare a da pagare un termine precedentemente segnato già pagato dallo stesso debitore.

        Il creditore ha la facoltà di segnare già pagato un termine per il quale non esiste un pagamento,

        settare egli stesso un termine già pagato già settato dal debitore (questo può essere visto come il fatto che il creditore conferma l''operato del debitore),

        settare a da pagare un termine settato pagato sia da se stesso o dal debitore (in questo caso il creditore non conferma l''indicazione del debitore sul fatto che tale termine è già stato pagato per altre vie)'
      parameters:
      - description: ID dell'owner della richiesta
        example: 84461172-4326-4D6B-AEA7-840ED1372200
        in: path
        name: tenantID
        required: true
        schema:
          example: 84461172-4326-4D6B-AEA7-840ED1372200
          format: uuid
          type: string
      - description: Identificativo univoco della fattura definito come HEX SHA256 di [numero][anno][partita_iva_mittente]
