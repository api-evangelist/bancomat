          description: Le credenziali fornite non sono sufficienti a completare la richiesta
        '403':
          content:
            application/json; charset=utf-8:
              example:
                code: 12345678
                errorDescription: hello
                errorURI: null
                expectedType: null
                field: null
                requestID: null
                service: 12345678
                statusCode: 12345678
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: La richiesta non è autorizzata a procedere con le credenziali fornite
        '404':
          content:
            application/json; charset=utf-8:
              example:
                code: 12345678
                errorDescription: hello
                errorURI: null
                expectedType: null
                field: null
                requestID: null
                service: 12345678
                statusCode: 12345678
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: La richiesta fa riferimento ad una risorsa inesistente
      security:
      - ThirdPartyClientCredential: []
      - ThirdPartyAuthorizationCode: []
      summary: List bulk documents
      tags:
      - Bulk
      operationId: getByTenantIDBulk
      x-operation-id-source: derived
    post:
      description: 'Crea un nuvo document Bulk. L''endpoint permette di collegare le fingerprint, presenti nel corpo della richiesta, (i campi indicano la tipologia di documento), in un unico documento bulk.

        Restituisce il documento bulk creato con una nuova fingerprint.'
      parameters:
      - description: ID dell'owner della richiesta
        example: 84461172-4326-4D6B-AEA7-840ED1372200
        in: path
        name: tenantID
        required: true
        schema:
          example: 84461172-4326-4D6B-AEA7-840ED1372200
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              example:
                documents:
                  invoice:
                  - d41d8cd98f00b204e9800998ecf8427e
                  - GskefcByhlsgCSUODJPWTRFaOVsPGDdq
                  pagopa:
                  - RXi4PrrsOTiPxUVsbo12TAAD9kmTH2cM
              minProperties: 1
              properties:
                documents:
                  additionalProperties:
                    description: List of fingerprints to be linked to the bulk payment. I nomi delle proprieta sono le tipologie dei documenti.
                    items:
                      $ref: '#/components/schemas/Fingerprint'
                    minItems: 1
                    type: array
                    uniqueItems: true
                  description: Dizionario delle fingerprint che saranno collegate al pagemento bulk, i nomi delle proprieta sono le tipologie dei documenti.
                  type: object
              propertyNames:
                $ref: '#/components/schemas/DocumentKindEnum'
              required:
              - additionalProperties
              type: object
        description: Preferenze e fingerprints che faranno parte del bulk.
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bulk'
          description: Bulk payment created
        '400':
          content:
            application/json; charset=utf-8:
              example:
                code: 12345678
                errorDescription: hello
                errorURI: null
                expectedType: null
                field: null
                requestID: null
                service: 12345678
                statusCode: 12345678
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: La richiesta non è corretta sintatticamente, body, headers, path o query params non conformi alla documentazione
        '401':
          content:
            application/json; charset=utf-8:
              example:
                code: 12345678
                errorDescription: hello
                errorURI: null
                expectedType: null
                field: null
                requestID: null
                service: 12345678
                statusCode: 12345678
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: Le credenziali fornite non sono sufficienti a completare la richiesta
        '403':
          content:
            application/json; charset=utf-8:
              example:
                code: 12345678
                errorDescription: hello
                errorURI: null
                expectedType: null
                field: null
                requestID: null
                service: 12345678
                statusCode: 12345678
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: La richiesta non è autorizzata a procedere con le credenziali fornite
        '404':
          content:
            application/json; charset=utf-8:
              example:
                code: 12345678
                errorDescription: hello
                errorURI: null
                expectedType: null
                field: null
                requestID: null
                service: 12345678
                statusCode: 12345678
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: La richiesta fa riferimento ad una risorsa inesistente
      security:
      - ThirdPartyClientCredential: []
      - ThirdPartyAuthorizationCode: []
      tags:
      - Bulk
      summary: Create by tenant id bulk
      x-summary-source: derived
      operationId: postByTenantIDBulk
      x-operation-id-source: derived
    servers:
    - url: https://app.flowpay.it/api
      variables: {}
  /{tenantID}/bulk/{fingerprint}:
    delete:
      description: 'Elimina un bulk payment con la fingerprint.

        Non avrà effetto sui documenti collegati (non verranno eliminati).'
      parameters:
      - description: ID dell'owner della richiesta
        example: 84461172-4326-4D6B-AEA7-840ED1372200
        in: path
        name: tenantID
        required: true
        schema:
          example: 84461172-4326-4D6B-AEA7-840ED1372200
          format: uuid
          type: string
      - in: path
        name: fingerprint
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Bulk payment deleted
        '400':
          content:
            application/json; charset=utf-8:
              example:
                code: 12345678
                errorDescription: hello
                errorURI: null
                expectedType: null
                field: null
                requestID: null
                service: 12345678
                statusCode: 12345678
              schema:
