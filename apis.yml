  - aid: bancomat:flowpay-api-v2
    name: FlowPay API (v2)
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/bancomat.png
    description: >-
      Second-generation FlowPay API published as OpenAPI 3.1.0 (2.0.0-alpha.4) in the public
      FlowPay/client-openapi GitHub repository, with operationIds, page/size pagination,
      documented 100 req/min and 10 req/s rate limits, and a shared public sandbox. Adds
      credit notes, proforma invoices, construction-site escrow flows, fee rules and KYC to
      the v1 surface, and describes an AIS consent-status webhook. The production server
      api.flowpay.it/v2 answers unauthenticated reads (GET /v2/banks returned 200 on
      2026-09-17) even though the spec still labels it "Not implemented".
    humanURL: https://github.com/FlowPay/client-openapi
    baseURL: https://api.flowpay.it/v2
