source: components.schemas $ref graph and *ID/*fingerprint reference fields of openapi/bancomat-flowpay-api-v2-openapi.yml
  and openapi/bancomat-flowpay-api-v1-openapi.yml; docs/invoice_lifecycle.md, bulk_lifecycle.md, chain_lifecycle.md, fee_description.md
  in github.com/FlowPay/client-openapi
note: FlowPay (a BANCOMAT company) data model. Every payable thing is a "document" identified by a content fingerprint (invoice,
  proforma, credit note, bill/ricevuta, salary, transfer, pagoPA notice, bulk, chain); a checkout wraps one document into
  a hosted payment session; payments and transactions are observed through AIS on tenant bank accounts. v1 schemas are Italian-named
  DTOs, v2 English — both are listed with their api tag.
id_conventions:
  tenantID: UUID of the company/person owning the data (v1 path prefix, v2 token-derived)
  fingerprint: content hash identifying a document (MD5-shaped in examples)
  code: checkout code (checkout URL slug)
  identifier: UUID of a payment (webhook payloads) or construction contract/site
  requestID / correlationId: server-side error correlation id
  flowpayID: v1 bank identifier; v2 uses banks/{id}
