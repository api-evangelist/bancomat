        url: https://docs.flowpay.it/
      - type: APIReference
        url: https://docs.flowpay.it/
      - type: DeveloperPortal
        url: https://developer.flowpay.it/
      - type: OpenAPI
        url: openapi/bancomat-flowpay-api-v1-openapi.yml
      - type: OpenAPI
        url: openapi/_original/bancomat-flowpay-api-v1-openapi.json
        name: FlowPay API v1 OpenAPI (verbatim, as served through docs.flowpay.it)
      - type: Webhooks
