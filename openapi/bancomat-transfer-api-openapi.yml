openapi: 3.2.0
info:
  title: Bancomat Transfer API
  version: 1.0.0
  contact:
    email: federico.giuntoli@flowpay.it
    name: Federico Giuntoli
  termsOfService: https://www.flowpay.it/tos
  description: 'Operations tagged Transfer across 2 of this provider''s published API definitions: bancomat-flowpay-api-v1-openapi.json, bancomat-flowpay-api-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://app.flowpay.it/api
  variables: {}
tags:
- description: Documenti senza Lifecycle
  name: Transfer
paths:
  /{tenantID}/transfers:
    get:
      description: Recupera la lista dei documenti di tipo transfer
      parameters:
      - description: ID dell'owner della richiesta
        example: 84461172-4326-4D6B-AEA7-840ED1372200
        in: path
        name: tenantID
        required: true
        schema:
          example: 84461172-4326-4D6B-AEA7-840ED1372200
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
              - amount: 15.75
                date: '2024-08-22T15:20:30Z'
                debtor: CMLLBR43E41C375Z
                fingerprint: d41d8cd98f00b204e9800998ecf8427e
              - amount: 1
                date: '2024-08-22T15:20:30Z'
                debtor: CNTVTR74R01C070U
                fingerprint: aa1d8cd98f00b204e9800998aaf842aa
              schema:
                items:
                  $ref: '#/components/schemas/Transfer'
                type: array
          description: Transfer documents list
        '400':
          content:
            application/json; charset=utf-8:
              example:
                code: 12345678
                errorDescription: hello
                errorURI: null
                expectedType: null
                field: null
                requestID: null
                service: 12345678
                statusCode: 12345678
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: La richiesta non è corretta sintatticamente, body, headers, path o query params non conformi alla documentazione
        '401':
          content:
            application/json; charset=utf-8:
              example:
                code: 12345678
                errorDescription: hello
                errorURI: null
                expectedType: null
                field: null
                requestID: null
                service: 12345678
                statusCode: 12345678
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: Le credenziali fornite non sono sufficienti a completare la richiesta
        '403':
          content:
            application/json; charset=utf-8:
              example:
                code: 12345678
                errorDescription: hello
                errorURI: null
                expectedType: null
                field: null
                requestID: null
                service: 12345678
                statusCode: 12345678
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: La richiesta non è autorizzata a procedere con le credenziali fornite
        '404':
          content:
            application/json; charset=utf-8:
              example:
                code: 12345678
                errorDescription: hello
                errorURI: null
                expectedType: null
                field: null
                requestID: null
                service: 12345678
                statusCode: 12345678
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: La richiesta fa riferimento ad una risorsa inesistente
      security:
      - ThirdPartyClientCredential:
        - transfers:read
      - ThirdPartyAuthorizationCode:
        - transfers:read
      tags:
      - Transfer
      summary: Get by tenant id transfers
      x-summary-source: derived
      operationId: getByTenantIDTransfers
      x-operation-id-source: derived
    post:
      description: Consente di creare un nuovo documento trasfert. Il corpo della richiesta deve includere tutte le informazioni necessarie per completare il trasferimento, come l'importo, l'IBAN del creditore, il codice fiscale del creditore e del debitore, e la data della transazione.
      parameters:
      - description: ID dell'owner della richiesta
        example: 84461172-4326-4D6B-AEA7-840ED1372200
        in: path
        name: tenantID
        required: true
        schema:
          example: 84461172-4326-4D6B-AEA7-840ED1372200
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            example:
              amount: 15.75
              creditor: BRNMHL77L01Z602U
              creditorIBAN: IT45S0300203280877589174726
              date: '2024-08-22T15:20:30Z'
              debtor: CMLLBR43E41C375Z
              remittance: Pagamento due pizze
            schema:
              properties:
                amount:
                  description: Amount of the transfer
                  example: 100.34
                  format: float
                  type: number
                  x-faker: finance.amount
                creditor:
                  description: Codice fiscale del creditore (vat code in caso di azienda, codice fiscale in caso di privato)
                  example: string
                  type: string
                creditorIBAN:
                  description: IBAN del creditore, modificabile dal creditore o dal debitore nel caso il creditore non abbia già modificato l'iban.
                  example: string
                  type: string
                date:
                  example: '2020-03-03T17:32:28Z'
                  format: date-time
                  type: string
                debtor:
                  description: Codice fiscale del debitore (vat code in caso di azienda, codice fiscale in caso di privato)
                  example: string
                  type: string
                remittance:
                  description: Remittance information of the SEPA Credit Transfer
                  example: Pizza at Pizzeria da Mario. Thank you!
                  type: string
                  x-faker: lorem.sentence
              required:
              - amount
              - creditor
              - creditorIBAN
              - date
              - debtor
              - remittance
              type: object
        description: Transfer details
        required: true
      responses:
        '201':
          content:
            application/json:
              example:
                amount: 15.75
                date: '2024-08-22T15:20:30Z'
                debtor: CMLLBR43E41C375Z
                fingerprint: d41d8cd98f00b204e9800998ecf8427e
              schema:
                $ref: '#/components/schemas/Transfer'
          description: Transfer created
        '400':
          content:
            application/json; charset=utf-8:
              example:
                code: 12345678
                errorDescription: hello
                errorURI: null
                expectedType: null
                field: null
                requestID: null
                service: 12345678
                statusCode: 12345678
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: La richiesta non è corretta sintatticamente, body, headers, path o query params non conformi alla documentazione
        '401':
          content:
            application/json; charset=utf-8:
              example:
                code: 12345678
                errorDescription: hello
                errorURI: null
                expectedType: null
                field: null
                requestID: null
                service: 12345678
                statusCode: 12345678
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: Le credenziali fornite non sono sufficienti a completare la richiesta
        '403':
          content:
            application/json; charset=utf-8:
              example:
                code: 12345678
                errorDescription: hello
                errorURI: null
                expectedType: null
                field: null
                requestID: null
                service: 12345678
                statusCode: 12345678
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: La richiesta non è autorizzata a procedere con le credenziali fornite
        '404':
          content:
            application/json; charset=utf-8:
              example:
                code: 12345678
                errorDescription: hello
                errorURI: null
                expectedType: null
                field: null
                requestID: null
                service: 12345678
                statusCode: 12345678
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: La richiesta fa riferimento ad una risorsa inesistente
      security:
      - ThirdPartyClientCredential:
        - transfers:write
      - ThirdPartyAuthorizationCode:
        - transfers:write
      summary: Creazione di un nuovo documento trasfert
      tags:
      - Transfer
      operationId: postByTenantIDTransfers
      x-operation-id-source: derived
    servers:
    - url: https://app.flowpay.it/api
      variables: {}
  /{tenantID}/transfers/plan:
    post:
      description: Crea un nuvo document transfer
      parameters:
      - description: ID dell'owner della richiesta
        example: 84461172-4326-4D6B-AEA7-840ED1372200
        in: path
        name: tenantID
        required: true
        schema:
          example: 84461172-4326-4D6B-AEA7-840ED1372200
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            example:
              creditor: '12345678901'
              creditorIBAN: IT45S0300203280877589174726
              date: '2024-08-22T10:00:00Z'
              debtor: '10987654321'
              planType:
                singleTerms:
                  number: 5
              remittance: Pagamento per servizi di consulenza
              singleAmount: 100.34
            schema:
              properties:
                creditor:
                  description: Codice fiscale del creditore (vat code in caso di azienda, codice fiscale in caso di privato)
                  example: string
                  type: string
                creditorIBAN:
                  description: IBAN del creditore, modificabile dal creditore o dal debitore nel caso il creditore non abbia già modificato l'iban.
                  example: string
                  type: string
                date:
                  example: '2020-03-03T17:32:28Z'
                  format: date-time
                  type: string
                debtor:
                  description: Codice fiscale del debitore (vat code in caso di azienda, codice fiscale in caso di privato)
                  example: string
                  type: string
                planType:
                  description: Rappresenta un tipo di piano che può essere a termini singoli o ricorrenti.
                  oneOf:
                  - description: Un piano con termini singoli, che non si ripetono.
                    properties:
                      singleTerms:
                        properties:
                          number:
                            type: integer
                        required:
                        - number
                    required:
                    - singleTerms
                  - description: Un piano con termini che si ripetono a una frequenza determinata.
                    properties:
                      recurringTerms:
                        properties:
                          frequency:
                            enum:
                            - monthly
                            type: string
                          number:
                            type: integer
                        required:
                        - number
                        - frequency
                    required:
                    - recurringTerms
                remittance:
                  description: Remittance information of the SEPA Credit Transfer
                  example: Pizza at Pizzeria da Mario. Thank you!
                  type: string
                  x-faker: lorem.sentence
                singleAmount:
                  description: Amount of the transfer
                  example: 100.34
                  format: float
                  type: number
                  x-faker: finance.amount
              required:
              - singleAmount
              - creditor
              - creditorIBAN
              - debtor
              - remittance
              - date
              - planType
              type: object
        description: Transfer details
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
          description: Transfer created
        '400':
          content:
            application/json; charset=utf-8:
              example:
                code: 12345678
                errorDescription: hello
                errorURI: null
                expectedType: null
                field: null
                requestID: null
                service: 12345678
                statusCode: 12345678
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: La richiesta non è corretta sintatticamente, body, headers, path o query params non conformi alla documentazione
        '401':
          content:
            application/json; charset=utf-8:
              example:
                code: 12345678
                errorDescription: hello
                errorURI: null
                expectedType: null
                field: null
                requestID: null
                service: 12345678
                statusCode: 12345678
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: Le credenziali fornite non sono sufficienti a completare la richiesta
        '403':
          content:
            application/json; charset=utf-8:
              example:
                code: 12345678
                errorDescription: hello
                errorURI: null
                expectedType: null
                field: null
                requestID: null
                service: 12345678
                statusCode: 12345678
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: La richiesta non è autorizzata a procedere con le credenziali fornite
        '404':
          content:
            application/json; charset=utf-8:
              example:
