      security:
      - ThirdPartyClientCredential:
        - transfers:write
      - ThirdPartyAuthorizationCode:
        - transfers:write
      tags:
      - Transfer
      summary: Create by tenant id transfers plan
      x-summary-source: derived
      operationId: postByTenantIDTransfersPlan
      x-operation-id-source: derived
    servers:
    - url: https://app.flowpay.it/api
      variables: {}
