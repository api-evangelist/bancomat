apis:
  - aid: bancomat:bancomat-pay
    name: BANCOMAT Pay
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/bancomat.png
    description: >-
      BANCOMAT Pay is a mobile payment service enabling Italian consumers to make e-commerce
      purchases and P2P transfers through a smartphone app linked to their bank account by
      phone number and IBAN. Merchant integration is typically handled through PSPs such as
      Nexi, Axerve, PPRO, and HiPay rather than a direct public API. Scheme-level technical
      documentation and certification material for issuers, acquirers and certified operators
      is distributed only through BANCOMAT Insight (insight.bancomat.it), an OTP-gated member
      portal; api.bancomat.it answers every unauthenticated path with a JSON 404.
    humanURL: https://bancomat.it/en/bancomat-pay
    tags:
      - Mobile Payments
      - P2P
      - Payments
      - Italy
    properties:
      - type: Documentation
        url: https://bancomat.it/en/bancomat-pay
      - type: Documentation
        url: https://developer.nexigroup.com/xpayglobal/en-EU/docs/bancomat-pay/
        name: Nexi Integration Guide
  - aid: bancomat:flowpay-api-v1
    name: FlowPay API (v1)
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/bancomat.png
    description: >-
      Production REST API of FlowPay S.r.l., the Bank of Italy-authorised payment institution
      (AISP/PISP, ref. 36925) that BANCOMAT S.p.A. acquired on 2025-07-22. Tenant-scoped
      endpoints for account information (AIS consents, accounts, balances, transactions),
      payment initiation (transfers, bulk and chain payments, hosted checkout sessions),
      invoices, salaries, pagoPA notices and webhook subscriptions, secured by OAuth 2.0
      authorization-code and client-credentials flows with PKCE, PAR and signed request objects.
      The contract is rendered by ReDoc on docs.flowpay.it from a 59-operation OpenAPI 3.0.3.
    humanURL: https://docs.flowpay.it/
    baseURL: https://app.flowpay.it/api
    tags:
      - Open Banking
      - Account Information
      - Payment Initiation
      - Invoicing
      - Webhooks
      - pagoPA
      - Italy
    properties:
