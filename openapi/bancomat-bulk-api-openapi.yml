  /bulk:
    post:
      summary: Create bulk document
      description: 'Create a new bulk document. This endpoint allows to specificy a dictionary of fingerprints to be linked to the bulk payment, each property name is the document type.

        Returns the bulk document created with a new fingerprint.'
      operationId: createBulkPayment
      security:
      - oAuth2: []
      tags:
      - Bulk
      requestBody:
        description: Preferences and fingerprints that will be part of the bulk payment.
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              propertyNames:
                $ref: '#/components/schemas/DocumentKindEnum_2'
              properties:
                allowWireTranfersAggregation:
                  type: boolean
                  description: If true, wire transfers to the same beneficiary will be aggregated, this determines a saving. If false, wire transfer to the same beneficiary will not be aggregated, this allows beneficiary to have a more detailed view of the payments and keeps the payment remittance information.
                  default: true
                documents:
                  type: object
                  description: Dictionary of fingerprints to be linked to the bulk payment, each property name is the document type.
                  additionalProperties:
                    type: array
                    items:
                      $ref: '#/components/schemas/Fingerprint_2'
                    minItems: 1
                    uniqueItems: true
                    description: List of fingerprints to be linked to the bulk payment. Property name is the document type.
              example:
                allowWireTranfersAggregation: true
                documents:
                  invoice:
                  - d41d8cd98f00b204e9800998ecf8427e
                  - GskefcByhlsgCSUODJPWTRFaOVsPGDdq
                  pagopa:
                  - RXi4PrrsOTiPxUVsbo12TAAD9kmTH2cM
              required:
              - additionalProperties
      responses:
        '201':
          description: Bulk payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bulk_2'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: List bulk documents
      description: 'List all bulk documents according to the specified filters.

        Returns a paginated list of bulk documents.'
      operationId: listBulkPayments
      security:
      - oAuth2: []
      tags:
      - Bulk
      parameters:
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
        x-faker: random.number
        x-fakerParams:
        - min: 1
      - name: pageSize
        in: query
        description: Page size
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        x-faker: random.number
        x-fakerParams:
        - min: 1
          max: 100
      responses:
        '200':
          description: Bulk payments list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginatedResult'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Bulk_2'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    servers:
    - url: https://api.flowpay.it/v2
      description: Production server (Not implementend)
    - url: https://mock.flowpay.it/v2
      description: Mock server
    - url: https://sandbox.{customerID}.flowpay.it/v2
      description: Customer-assigned sandbox server
      variables:
        customerID:
          default: 00000000-00000000-00000000-00000000
          description: Unique customer identifier assigned after contract signature
    - url: http://localhost:5002
      description: Debug
  /bulk/{fingerprint}:
    get:
      summary: Get document details
      description: Get bulk document details by ID
      operationId: getBulkPayment
      security:
      - oAuth2: []
      tags:
      - Bulk
      parameters:
      - name: fingerprint
        in: path
        description: Bulk payment fingerprint
        required: true
        schema:
          $ref: '#/components/schemas/Fingerprint_2'
        x-faker: datatype.uuid
      responses:
        '200':
          description: Bulk payment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bulk_2'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete bulk payment
      description: 'Delete bulk payment by ID.

        Deleting a bulk payment will not delete the linked documents.'
      operationId: deleteBulkPayment
      security:
      - oAuth2: []
      tags:
      - Bulk
      parameters:
      - name: fingerprint
        in: path
        description: Bulk payment fingerprint
        required: true
        schema:
          $ref: '#/components/schemas/Fingerprint_2'
        x-faker: datatype.uuid
      responses:
        '204':
          description: Bulk payment deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    servers:
    - url: https://api.flowpay.it/v2
      description: Production server (Not implementend)
    - url: https://mock.flowpay.it/v2
      description: Mock server
    - url: https://sandbox.{customerID}.flowpay.it/v2
      description: Customer-assigned sandbox server
      variables:
        customerID:
          default: 00000000-00000000-00000000-00000000
          description: Unique customer identifier assigned after contract signature
    - url: http://localhost:5002
      description: Debug
components:
  schemas:
    DocumentKindEnum:
      enum:
      - bill
      - bulk
      - chain
      - construction
      - invoice
      - pagopa
      - transfer
      type: string
    ErrorDTO:
      description: "Formato errore standard\n    \nLista dei possibili codici di errore:\n\n| codice | descrizione |\n| ------ | ----------- |\n| 401 | Errore generale di codifica |\n| 402 | Campo necessario mancante |\n| 403 | Valore di un campo del tipo sbagliato |\n| 404 | Valore di un campo assente |\n| 405 | Errore di codifica sconosciuto |\n| 406 | Null pointer exception |\n| 407 | Campo necessario mancante |\n| 408 | Errore di connessione |\n| 409 | Errore di input output |\n| 410 - 428 | Errore generico con il database |\n| 429, 432, 433 | Errore di logica con il database |\n| 430 | Campo invalido |\n| 431 | Campo assente |\n| 434 | Risultati non trovati |\n| 500 | Errore generico |\n| 2000 | Tenant non specificato |\n| 2001 | Non autorizzato ad operare su questa risorsa |\n| 2002 | Impossibile eliminare il documento poiché sono presente dei pagamenti collegati |\n| 2003 | Non autorizzato a creare la risorsa |\n| 2004 | Non autorizzato ad operare su questa risorsa |\n| 2005 | Si sta provando a modificare un termine non di questo documento |\n| 2006 | Codice istant scaduto |\n| 2007 | Non autorizzato generare un codice instant |\n| 2008 | Codice instant inesistente o non autorizzato a leggerlo |\n| 2012 | Si sta provando a caricare un documento già esistente |\n| 3001 | Tenant non specificato |\n| 4001 | Tenant non specificato |\n| 5001 | Corpo richiesta mancante |\n| 5002 | Corpo richiesta non valido |\n| 5003 | Vatcode del ricevente fattura mancante |\n| 6001 | Tenant non specificato |\n| 6002 | Ricevuta non trovata |\n| 8005 | Non puoi modificare questo conto |\n| 8010 | Troppi risultati ottenuti |\n| 11001 | Non autorizzato ad accedere a questa risorsa |\n| 11002 | Si sta provando a caricare un documento già esistente |\n| 13001 | Azienda non trovata |\n| 13003 | vatcode non è valido |"
      properties:
        code:
          description: Codice errore
          example: '12345678'
          format: int64
          type: integer
        errorDescription:
          description: Descrizione errore
          example: string
          type: string
        errorURI:
          description: URI dell'errore se presente
          example: string
          type: string
        expectedType:
          description: Nel caso di un errore di codifica indica il tipo di dato che non si è riuscito a decodificare
          example: string
          type: string
        field:
          description: Nel caso di un errore di codifica indica il campo che non si è riuscito a decodificare
          example: string
          type: string
        requestID:
          description: ID della richiesta da comunicare per poter fornire un supporto
          example: string
          type: string
        service:
          description: ID interno del servizio
          example: '12345678'
          format: int64
          type: integer
        statusCode:
          description: Codice di stato HTTP
          example: '12345678'
          format: int64
          type: integer
      required:
      - service
      - code
      - errorDescription
      - statusCode
      type: object
    Bulk:
      properties:
        amount:
          description: Importo totale del bulk
          example: 48223.07
          format: double
          type: number
        documents:
          additionalProperties:
            items:
              $ref: '#/components/schemas/Fingerprint'
            type: array
          description: Dizionario dei documenti relativi a bulk, con chiave il tipo di documento e con valore le fingerprint dei documenti
          type: object
        fingerprint:
          $ref: '#/components/schemas/Fingerprint'
      type: object
    Fingerprint:
      description: Fingerprint del documento
      example: d41d8cd98f00b204e9800998ecf8427e
      type: string
    DocumentKindEnum_2:
      type: string
      enum:
      - bill
      - bulk
      - chain
      - construction
      - invoice
      - pagopa
      - transfer
      description:
        $ref: types/DocumentKind.md
    RequestID:
      type: string
      description: Unique identifier of the request.<br> It is helpful to identify the request in case of errors, providing it to the support team. Please submit it in the support ticket.
      format: uuid
      x-faker: random.uuid
    Bulk_2:
      type: object
      properties:
        fingerprint:
          $ref: '#/components/schemas/Fingerprint_2'
        amount:
          type: number
          format: double
          example: 48223.07
          description: Total amount of the bulk
        allowWireTranfersAggregation:
          type: boolean
          example: true
          description: Indicate if the wire transfers to the same beneficiary can be aggregated
        documents:
          type: object
          description: Dictionary of documents related to the bulk. Keys are the document type, values are the fingerprints of the documents.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/Fingerprint_2'
    PaginatedResult:
      type: object
      properties:
        page:
          type: integer
          description: Current page number
        pageSize:
          type: integer
          description: Number of items per page
        total:
          type: integer
          description: Total number of items
        items:
          type: array
          description: List of items
          items: {}
    Fingerprint_2:
      type: string
      description: Fingerprint of the document
      example: d41d8cd98f00b204e9800998ecf8427e
    StatusCode:
      type: integer
      description: HTTP status code
      example: 404
  responses:
    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode:
                $ref: '#/components/schemas/StatusCode'
              requestID:
                $ref: '#/components/schemas/RequestID'
              message:
                type: string
                description: Error message
                example: Invoice not found
            required:
            - statusCode
            - requestID
            - message
    InternalServerError:
      description: Server encountered an unexpected condition that prevented it from fulfilling the request
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode:
                $ref: '#/components/schemas/StatusCode'
              requestID:
                $ref: '#/components/schemas/RequestID'
            required:
            - statusCode
            - requestID
    Unauthorized:
      description: Client has not provided valid credentials to access the requested resource
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode:
                $ref: '#/components/schemas/StatusCode'
              requestID:
                $ref: '#/components/schemas/RequestID'
              message:
