        in: path
        name: fingerprint
        required: true
        schema:
          example: '[1][2021][06968160488] -> fe92051fc0d735f31f6e85ae8515838e6540ba994ede74c5cb2f19599e723d49'
          type: string
      requestBody:
        content:
          application/vnd.api+json; charset=utf-8:
            example:
            - id: cb15b52a-91db-41ed-81a0-764a0cc4795d
              paid: false
            schema:
              $ref: '#/components/schemas/PaidOutsideFlowPayTermList'
        required: true
      responses:
        '201':
          content:
            application/json; charset=utf-8:
              example:
                amount: 123.45
                attachments: null
                date: '2020-03-03T17:32:28Z'
                example: EUR
                fingerprint: d41d8cd98f00b204e9800998ecf8427e
                id: null
                items:
                - amount: 123.45
                  description: hello
                  id: null
                  quantity: 123.45
                number: hello
                recipientIban: null
                recipientVat: hello
                rootSubstitutedBy: null
                senderIban: null
                senderVat: hello
                substitutedBy: null
                terms:
                - amount: 123.45
                  description: hello
                  expire: '2020-03-03T17:32:28Z'
                  fingerprint: d41d8cd98f00b204e9800998ecf8427e
                  id: null
                  information: hello
                  method: null
                  recurringInfo: null
                  useFlowpay: null
              schema:
                $ref: '#/components/schemas/Invoice'
          description: ''
        '400':
          content:
            application/json; charset=utf-8:
              example:
                code: 12345678
                errorDescription: hello
                errorURI: null
                expectedType: null
                field: null
                requestID: null
                service: 12345678
                statusCode: 12345678
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: La richiesta non è corretta sintatticamente, body, headers, path o query params non conformi alla documentazione
