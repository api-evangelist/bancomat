request_id_field: requestID (v1/v2 contract) / correlationId (v2 live) — quote it in support tickets at https://youtrack.flowpay.it/
retry_guidance:
  '429': 'documented for v2: 100 requests/minute per source IP and 10 requests/second burst; back off and retry
    (no Retry-After header documented)'
  5xx: v2 InternalServerError component; retry with backoff
  '417': v1 uses 417 Expectation Failed for business-rule violations (e.g. document already exists, payments linked)
    — not retryable without changing the request
