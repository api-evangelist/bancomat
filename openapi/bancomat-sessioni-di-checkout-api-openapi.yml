  /{tenantID}/checkout/{type}/{fingerprint}:
    get:
      description: Restituisce le informazioni sullo stato del checkout identificato da tipo e fingerprint.
      parameters:
      - description: ID dell'owner della richiesta
        example: 84461172-4326-4D6B-AEA7-840ED1372200
        in: path
        name: tenantID
        required: true
        schema:
          example: 84461172-4326-4D6B-AEA7-840ED1372200
          format: uuid
          type: string
      - description: tipo di documento
        example: invoice
        in: path
        name: type
        required: true
        schema:
          example: invoice
          format: enum('invoice, 'bill')
          type: string
      - description: Identificativo univoco della fattura definito come HEX SHA256 di [numero][anno][partita_iva_mittente]
        example: '[1][2021][06968160488] -> fe92051fc0d735f31f6e85ae8515838e6540ba994ede74c5cb2f19599e723d49'
        in: path
        name: fingerprint
