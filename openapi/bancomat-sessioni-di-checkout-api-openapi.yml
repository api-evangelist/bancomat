openapi: 3.2.0
info:
  title: Bancomat Sessioni di checkout API
  version: 1.0.0
  contact:
    email: federico.giuntoli@flowpay.it
    name: Federico Giuntoli
  termsOfService: https://www.flowpay.it/tos
  description: 'Operations tagged Sessioni di checkout across 2 of this provider''s published API definitions: bancomat-flowpay-api-v1-openapi.json, bancomat-flowpay-api-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://app.flowpay.it/api
  variables: {}
tags:
- description: 'Gestione e creazione di un codici di checkout


    Il codice di checkout permette di far pagare un documento caricato su FlowPay attraverso il nostro flusso di checkout.


    Il flusso per il checkout passa dall''ottenere il codice di checkout e redirezionare il proprio utente verso la pagina

    * `https://checkout.flowpay.it/{code}` in produzione

    * `https://checkout.sandbox-new.flowpay.it/{code}` in sandbox'
  name: Sessioni di checkout
paths:
  /{tenantID}/checkout:
    post:
      description: 'Crea un codice di checkout per il documento identificato da tipo e fingerprint.

        Nel caso un codice sia già stato creato per il documento, viene restituito un errore.'
      parameters:
      - description: ID dell'owner della richiesta
        example: 84461172-4326-4D6B-AEA7-840ED1372200
        in: path
        name: tenantID
        required: true
        schema:
          example: 84461172-4326-4D6B-AEA7-840ED1372200
          format: uuid
          type: string
      requestBody:
        content:
          application/vnd.api+json; charset=utf-8:
            example:
              fingerprint: d41d8cd98f00b204e9800998ecf8427e
              nokRedirect: https://www.google.com/search?q=nok
              okRedirect: https://www.google.com/search?q=ok
              type: invoice
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
        required: true
      responses:
        '201':
          content:
            application/json; charset=utf-8:
              example:
                code: hello
                expire: null
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
          description: ''
        '400':
          content:
            application/json; charset=utf-8:
              example:
                code: 12345678
                errorDescription: hello
                errorURI: null
                expectedType: null
                field: null
                requestID: null
                service: 12345678
                statusCode: 12345678
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: La richiesta non è corretta sintatticamente, body, headers, path o query params non conformi alla documentazione
        '401':
          content:
            application/json; charset=utf-8:
              example:
                code: 12345678
                errorDescription: hello
                errorURI: null
                expectedType: null
                field: null
                requestID: null
                service: 12345678
                statusCode: 12345678
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: Le credenziali fornite non sono sufficienti a completare la richiesta
        '403':
          content:
            application/json; charset=utf-8:
              example:
                code: 12345678
                errorDescription: hello
                errorURI: null
                expectedType: null
                field: null
                requestID: null
                service: 12345678
                statusCode: 12345678
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: La richiesta non è autorizzata a procedere con le credenziali fornite
        '404':
          content:
            application/json; charset=utf-8:
              example:
                code: 12345678
                errorDescription: hello
                errorURI: null
                expectedType: null
                field: null
                requestID: null
                service: 12345678
                statusCode: 12345678
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: La richiesta fa riferimento ad una risorsa inesistente
        '417':
          content:
            application/json; charset=utf-8:
              example:
                code: 12345678
                errorDescription: hello
                errorURI: null
                expectedType: null
                field: null
                requestID: null
                service: 12345678
                statusCode: 12345678
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: La richiesta non è corretta semanticamente
      security:
      - ThirdPartyClientCredential:
        - pagopa
      - ThirdPartyClientCredential:
        - pagopa
      - ThirdPartyClientCredential:
        - pagopa
      - ThirdPartyClientCredential:
        - pagopa
      - ThirdPartyClientCredential:
        - pagopa
      - ThirdPartyAuthorizationCode:
        - transfer:write
      - ThirdPartyAuthorizationCode:
        - transfer:write
      - ThirdPartyAuthorizationCode:
        - transfer:write
      - ThirdPartyAuthorizationCode:
        - transfer:write
      summary: Create by tenant id checkout
      tags:
      - Sessioni di checkout
      x-summary-source: derived
      operationId: postByTenantIDCheckout
      x-operation-id-source: derived
