- aid: bancomat:bancomat-chain-api
  name: Bancomat Chain API
  description: >-
    Questo endpoint consente di concatenare i pagamenti tra diversi documenti, automatizzando il pagamento
    di una fattura utilizzando l'importo ricevuto da un'altra fattura attiva. <br> Nota: L'API per questo
    endpoint non richiede scopi specifici; il token di autorizzazione utilizzato deve avere accesso ai
    documenti da pagare.


    Il processo della catena di pagamento funziona collegando un documento "ring" che collega un documento
    di attivazione a un documento di destinazione. Una volta creato il documento ring, esso stabilisce
    una connessione tra il documento di attivazione, che avvia la catena di pagamento, e il documento
    di destinazione, che riceverà il pagamento una volta che il documento di attivazione è stato pagato
    tramite FlowPay.


    Ad esempio, supponiamo che ci siano due documenti. Il primo documento riguarda un pagamento che l'azienda
    A deve effettuare all'azienda B, mentre il secondo documento riguarda un pagamento che l'azienda B
    deve effettuare all'azienda C. Per automatizzare questi pagamenti, l'azienda B crea un "anello" utilizzando
    il suo token di autorizzazione. Questo anello collega il primo documento come "trigger" (documento
    di attivazione) e il secondo documento come "target" (documento di destinazione).


    Una volta creato l'anello, è possibile generare sessioni di checkout per ciascun documento. Il checkout
    per il documento di attivazione procede come un processo di pagamento standard, mentre il checkout
    per il documento di destinazione viene creato con un tipo di catena. Questo tipo di checkout a catena
    per il documento di destinazione non richiede un pagamento immediato, ma attende il pagamento del
    documento di attivazione.


    Quando l'azienda B accede e completa il checkout per il documento di destinazione, non viene effettuato
    alcun pagamento. Tuttavia, quando il documento di attivazione viene pagato, si attiva automaticamente
    il pagamento del documento di destinazione. Se c'è un importo residuo dopo il pagamento del documento
    di destinazione, l'azienda B lo riceverà.


    In questo modo, l'automazione dei pagamenti assicura che tutti i documenti coinvolti siano regolati
    in modo sequenziale, utilizzando i fondi ricevuti da un documento attivo per pagare un altro documento
    in sospeso, riducendo al minimo l'intervento manuale e semplificando la gestione dei flussi di cassa
    tra le aziende coinvolte.


    ### Utilizzo della catena di pagamento per il pagamento frazionato


    In uno scenario di pagamento frazionato, la catena di pagamento può essere utilizzata per distribuire
    automaticamente i fondi tra più parti, anche trattenendo una parte del pagamento per il partner prima
    di inoltrare l'importo rimanente al creditore. Ad esempio, supponiamo che l'azienda A debba pagare
    l'azienda B, ma che una parte del pagamento sia trattenuta dall'azienda C (che agisce come partner
    o intermediario). L'azienda A crea un documento di attivazione che rappresenta il pagamento che deve
    all'azienda B. Viene quindi creato un documento ring che collega questo documento di attivazione a
    due documenti di destinazione: uno per l'azienda B e uno per l'azienda C.


    Quando l'azienda A effettua il pagamento, la catena di pagamento assicura che i fondi vengano prima
    instradati attraverso l'azienda C. La parte a cui l'azienda C ha diritto (come concordato) viene trattenuta,
    mentre il resto del pagamento viene automaticamente inoltrato all'azienda B. Questa configurazione
    assicura che il pagamento frazionato venga gestito senza problemi, con un intervento manuale minimo,
    e che tutte le parti ricevano gli importi dovuti secondo le regole predefinite della catena di pagamento.
