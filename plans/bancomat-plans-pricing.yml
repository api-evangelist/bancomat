description: >-
  No public API plan tiers or self-serve prices are published by BANCOMAT S.p.A. or by its
  FlowPay subsidiary. Merchants are told to "contact your bank" to accept BANCOMAT Pay
  (services-for-your-ecommerce); scheme participants negotiate interbank fees as members
  (interbank-fees page, member-only detail via BANCOMAT Insight); FlowPay's site has no pricing
  page (flowpay.it/prezzi and /pricing answer with the homepage) and its API docs say fee rules
  are "determined during the initial system setup, tailored to the specific contractual
  requirements of each partner" and exposed at runtime through GET /fee/rules. plan_count is an
  honest zero. This file REPLACES a 2026-05-04 scaffold whose Free / Professional / Enterprise
  tiers were placeholders, not provider-published values.
plan_count: 0
plans: []
pricing_model:
  type: contract
  self_serve: false
  public_prices: false
  note: >-
    FlowPay fees are per-partner contractual rules by payment method (pis, sdd, card) and
    document type, charged to creditor (split payment) or debtor (bulk payment), percentage or
    fixed per unit, with optional minimum amounts — readable per document via GET /fee/rules
    (v2). Sandbox access is free on registration at https://developer.flowpay.it; production
    third-party access requires enablement.
