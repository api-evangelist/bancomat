rfc9457: false
note: FlowPay (a BANCOMAT company) API errors. Neither generation uses application/problem+json. v1 returns an ErrorDTO
  with a numeric application code alongside the HTTP status; v2 returns {statusCode, requestID, message, additionalInfo}.
  The live v2 host answered with {error, correlationId, statusCode, message, additionalData{statusCode, reason}}
  — field names differ from the contract (correlationId vs requestID, additionalData vs additionalInfo). The BANCOMAT
  scheme itself publishes no error reference.
envelopes:
- api: FlowPay API (v1)
  content_type: application/json; charset=utf-8
  schema: ErrorDTO
  fields:
  - code
  - errorDescription
  - errorURI
  - expectedType
  - field
  - requestID
  - service
  - statusCode
  observed_live:
    url: https://app.flowpay.it/api
    status: 404
    body:
      statusCode: 404
      code: -404
      errorDescription: Not Found
      requestID: <uuid>
- api: FlowPay API (v2)
  content_type: application/json
  fields:
  - statusCode
  - requestID
  - message
  - additionalInfo{path,key,type}
  observed_live:
    url: https://api.flowpay.it/v2
    status: 404
    body:
      error: true
      correlationId: <uuid>
      statusCode: 404
      message: Not Found
      additionalData:
        statusCode: 404
        reason: Not Found
  note: live field names (correlationId, additionalData) differ from the contract (requestID, additionalInfo)
