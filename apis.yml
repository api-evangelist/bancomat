  description: >-
    BANCOMAT Pay is a mobile payment service enabling Italian consumers to make e-commerce purchases and
    P2P transfers through a smartphone app linked to their bank account by phone number and IBAN. Merchant
    integration is typically handled through PSPs such as Nexi, Axerve, PPRO, and HiPay rather than a
