- description: |-
    Transazioni conto corrente

    Le transazioni possono essere filtrate per data e iban. utilizzando i seguenti parametri:
    - `dateFrom`: data di inizio del filtro in formato ISO8601
    - `dateTo`: data di fine del filtro in formato ISO8601
    - `iban`: iban del conto corrente

    ad esempio: `/<tenant-id>/transactions?dateFrom=2022-07-19T19:29:48Z&dateTo=2022-10-19T19:29:48Z&iban=IT00A0000000000000000000000`
  name: Transazioni
- description: I pagamenti generati dall'approvazione di uno o più termini di pagamento relativi a una fattura
  name: Pagamenti
- description: "\nGestione e creazione di un codici di checkout\n\nIl codice di checkout permette di far pagare un documento caricato su FlowPay attraverso il nostro flusso di checkout.\n\nIl flusso per il checkout passa dall'ottenere il codice di checkout e redirezionare il proprio utente verso la pagina\n* `https://checkout.flowpay.it/{code}` in produzione\n* `https://checkout.sandbox-new.flowpay.it/{code}` in sandbox    \n"
  name: Sessioni di checkout
- description: ''
  name: Stipendi
- description: |
    Saldo conto corrente

    ## Balance Type
    The balance types given by this endpoint can be any of the following:

    | name | description |
    |---|---|
    | expected | Balance composed of booked entries and pending items known at the time of calculation, which projects the end of day balance if everything is booked on the account and no other entry is posted. |
    | authorised | The expected balance together with the value of a pre-approved credit line the ASPSP makes permanently available to the user. |
    | openingBooked | Book balance of the account at the beginning of the account reporting period. It always equals the closing book balance from the previous report. |
    | interimAvailable | Available balance calculated in the course of the account 'servicer's business day, at the time specified, and subject to further changes during the business day. The interim balance is calculated on the basis of booked credit and debit items during the calculation time/period specified. |
    | closingBooked | Balance of the account at the end of the pre-agreed account reporting period. It is the sum of the opening booked balance at the beginning of the period and all entries booked to the account during the pre-agreed account reporting period. |
    | forwardAvailable | Forward available balance of money that is at the disposal of the account owner on the date specified. |
  name: Saldo
- description: "Possibilità di visualizzare e creare documenti di pagamento tra l'azienda ed un consumatore.\n    \nIl flusso per eseguire generare una ricevuta è:\n1. Creare una ricevuta con l'endpoint\n2. Comporre la url di checkout con il code contenuto nei campi della risposta. L'url è quindi:\n    - https://app.sandbox-new.flowpay.it/instant/{code} nel caso della sandbox\n    - https://app.flowpay.it/instant/{code} nel caso di produzione\n3. Far aprire in un popup l'url creata in precedenza.\n\n### Importante\n\nDurante il periodo di deprecazione delle API di instant, la creazione di una Ricevuta da API continuerà a generare il codice di checkout per tale Ricevuta.\nPer evitare che ciò accada è possibile inviare il parametro `skip-instant=true` nei query params della richiesta.\nDopo il periodi di deprecazione la creazione di un bill non creerà più in automatico il codice di checkout."
  name: Ricevute
- description: Documenti senza Lifecycle
  name: Transfer
- description: |+
    Questo endpoint consente di effettuare pagamenti bulk di documenti di diversi tipi. <br> Nota: l'API di questo endpoint non richiede scope specifici, il token di autorizzazione utilizzato deve avere accesso ai documenti che desidera pagare.

    <p align="center">

    <img src="https://mermaid.ink/svg/pako:eNqFkl9rwjAUxb9KyB58qWCryOjDwO4PCGOIle2lL7fNrQs2iUtT0YnffYmtGjdhebo553dPEm72tFAMaUxrAwafOCw1iEwSuxjXWBiuJHmdt8pUbhQvMExQhv3-A0maanXlRM4hNy3XFP2yZrBUs4kTL5qrjthsmnbUND0Ki0m7Xxw7yIe9njvulhjRgArUAjizT9s7JKPmEwVmNLZlDrWtAk9_B80hr7B2wL7NzGippHkBwatd29ebq1wZ1QvIBjUDCQFxfVWXdWpJ-Xd3UDhebz1zrbkAvXtUldItcMcYDsviL5MozVD75Gg8LMrSI8FOZwNuQslq6ZNlVN5fZXrk_7HdBRa4NT4XDoaDEXpcjV8NygLfGpFfR57e5MhDJg92GtAYle5kQWOjGwxos2aX_0bjEqr6rD4zbpTuxMMPPNfQrg" width="50%">

    </p>

    Il diagramma sopra mostra come funziona bulk.

    Supponiamo il caso in cui un utente abbia due fatture per il beneficiario 1 (Ben1), una fattura per il beneficiario 2 (Ben2) e un pagamento PagoPA

    L'utente desidera pagare tutti in un'unica operazione.

    Il client dell'utente, che ha accesso a tutti i documenti, chiama l'endpoint in blocco con l'elenco dei documenti da pagare, l'endpoint restituisce un nuovo documento (Bulk) collegato a tutti i documenti da pagare.

    Il client fornisce il documento bulk all'utente, che ora può pagarlo con un'unica operazione di Payment Initiation (PIS). Il bonifico bancario consentito con PIS sul documento in blocco è indirizzato al conto tecnico FlowPay (TA). Quando il TA riceve il pagamento, divide l'importo tra i beneficiari e invia loro i pagamenti tramite bonifico bancario.

    In caso di pagamento bulk allo stesso beneficiario, il beneficiario effettivo di avvio del pagamento è il beneficiario stesso, quindi il pagatore può riconoscere facilmente la transazione. In caso contrario, il beneficiario effettivo di avvio del pagamento è FlowPay.

    I bonifici bancari ai beneficiari vengono inviati con lo stesso pagatore originale, quindi i beneficiari possono identificare facilmente il pagatore.

    Nota: il destinatario dei pagamenti pagoPA è FlowPay stesso, quindi i pagamenti correlati non vengono conteggiati nelle operazioni di suddivisione.

  name: Bulk
- description: |-
    Questo endpoint consente di concatenare i pagamenti tra diversi documenti, automatizzando il pagamento di una fattura utilizzando l'importo ricevuto da un'altra fattura attiva. <br> Nota: L'API per questo endpoint non richiede scopi specifici; il token di autorizzazione utilizzato deve avere accesso ai documenti da pagare.

    Il processo della catena di pagamento funziona collegando un documento "ring" che collega un documento di attivazione a un documento di destinazione. Una volta creato il documento ring, esso stabilisce una connessione tra il documento di attivazione, che avvia la catena di pagamento, e il documento di destinazione, che riceverà il pagamento una volta che il documento di attivazione è stato pagato tramite FlowPay.

    Ad esempio, supponiamo che ci siano due documenti. Il primo documento riguarda un pagamento che l'azienda A deve effettuare all'azienda B, mentre il secondo documento riguarda un pagamento che l'azienda B deve effettuare all'azienda C. Per automatizzare questi pagamenti, l'azienda B crea un "anello" utilizzando il suo token di autorizzazione. Questo anello collega il primo documento come "trigger" (documento di attivazione) e il secondo documento come "target" (documento di destinazione).

    Una volta creato l'anello, è possibile generare sessioni di checkout per ciascun documento. Il checkout per il documento di attivazione procede come un processo di pagamento standard, mentre il checkout per il documento di destinazione viene creato con un tipo di catena. Questo tipo di checkout a catena per il documento di destinazione non richiede un pagamento immediato, ma attende il pagamento del documento di attivazione.

    Quando l'azienda B accede e completa il checkout per il documento di destinazione, non viene effettuato alcun pagamento. Tuttavia, quando il documento di attivazione viene pagato, si attiva automaticamente il pagamento del documento di destinazione. Se c'è un importo residuo dopo il pagamento del documento di destinazione, l'azienda B lo riceverà.

    In questo modo, l'automazione dei pagamenti assicura che tutti i documenti coinvolti siano regolati in modo sequenziale, utilizzando i fondi ricevuti da un documento attivo per pagare un altro documento in sospeso, riducendo al minimo l'intervento manuale e semplificando la gestione dei flussi di cassa tra le aziende coinvolte.

    ### Utilizzo della catena di pagamento per il pagamento frazionato

    In uno scenario di pagamento frazionato, la catena di pagamento può essere utilizzata per distribuire automaticamente i fondi tra più parti, anche trattenendo una parte del pagamento per il partner prima di inoltrare l'importo rimanente al creditore. Ad esempio, supponiamo che l'azienda A debba pagare l'azienda B, ma che una parte del pagamento sia trattenuta dall'azienda C (che agisce come partner o intermediario). L'azienda A crea un documento di attivazione che rappresenta il pagamento che deve all'azienda B. Viene quindi creato un documento ring che collega questo documento di attivazione a due documenti di destinazione: uno per l'azienda B e uno per l'azienda C.

    Quando l'azienda A effettua il pagamento, la catena di pagamento assicura che i fondi vengano prima instradati attraverso l'azienda C. La parte a cui l'azienda C ha diritto (come concordato) viene trattenuta, mentre il resto del pagamento viene automaticamente inoltrato all'azienda B. Questa configurazione assicura che il pagamento frazionato venga gestito senza problemi, con un intervento manuale minimo, e che tutte le parti ricevano gli importi dovuti secondo le regole predefinite della catena di pagamento.
  name: Chain
- description: pagoPA è il sistema nazionale italiano che permette ai cittadini di pagare la pubblica amministrazione. FlowPay partecipa a pagoPA e consente agli utenti di pagare con l'open banking.
  name: pagoPA
