- aid: bancomat:bancomat-saldo-api
  name: Bancomat Saldo API
  description: >-
    Saldo conto corrente


    ## Balance Type

    The balance types given by this endpoint can be any of the following:


    | name | description |

    |---|---|

    | expected | Balance composed of booked entries and pending items known at the time of calculation,
    which projects the end of day balance if everything is booked on the account and no other entry is
    posted. |

    | authorised | The expected balance together with the value of a pre-approved credit line the ASPSP
    makes permanently available to the user. |

    | openingBooked | Book balance of the account at the beginning of the account reporting period. It
    always equals the closing book balance from the previous report. |

    | interimAvailable | Available balance calculated in the course of the account 'servicer's business
    day, at the time specified, and subject to further changes during the business day. The interim balance
    is calculated on the basis of booked credit and debit items during the calculation time/period specified.
    |

    | closingBooked | Balance of the account at the end of the pre-agreed account reporting period. It
    is the sum of the opening booked balance at the beginning of the period and all entries booked to
    the account during the pre-agreed account reporting period. |

    | forwardAvailable | Forward available balance of money that is at the disposal of the account owner
    on the date specified. |
  humanURL: https://bancomat.it/en/bancomat-pay
  baseURL: https://app.flowpay.it/api
  tags:
  - Saldo
