  https://core.flowpay.it/api/openid/.well-known/openid-configuration (also answered at
  /api/.well-known/openid-configuration) — a non-root path, which is why a root-only probe
  scores it absent. Every other path 404s or is answered by an SPA catch-all shell.
  bancomat.it publishes a robots.txt that disallows /.well-known/ for all agents, so that host
  was NOT probed; flowpay.it, www.flowpay.it, developer.flowpay.it and developers.flowpay.it
  return HTTP 200 with the site's HTML shell for every path (recorded as spa-shell, treated as
  a miss). No security.txt, api-catalog, ai-plugin.json, oauth-authorization-server or A2A
  agent card exists on any host.
